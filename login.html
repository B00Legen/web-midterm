<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="css/bootstrap.css">
		<link rel="stylesheet" href="css/style.css">
		<link rel="icon" type="image/png" href="images/logo.png">
		<title>Login</title>
	</head>
	
	<body>
		<div class="layout">
			<!-- Header --!>
			<div id="header">
				<a href="index.html">
					<img class="logo" src="images/logo.png">
				</a>
				<!-- other menus --!>
				<div>
					<a class="btn btn-primary" href="catalogue.html">Catalogue</a>
					<a class="btn btn-primary" href="search.html">Search</a>
					<a class="btn btn-primary" href="forum.html">Forum</a>
				</div>
				<!-- theme change and login --!>
				<div>
					<input type="checkbox" id="dark-mode-toggle" class="sr-only">
					<label for="dark-mode-toggle" class="btn btn-primary align-items-center">Change Theme</label>
					<a class="btn btn-primary" href="login.html">Log in</a>
				</div>
			</div>
			
			<div class="content">
				<form class="panel">
					<label for="name">Name</label>
					<input type="text" id="name" name="name"><br><br>
					<label for="email">Email</label>
					<input type="email" id="email" name="email"><br><br>
					<label for="color">Favorite Color</label>
					<input type="submit" value="Submit">
				</form>
			</div>
			
			<!-- Footer --!>
			<div id="footer">
				
			</div>
		</div>
	</body>
</html>
